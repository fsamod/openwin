name: Catalog correction
description: Report an incorrect app name, package ID, publisher, category, homepage, or description.
title: "[Catalog]: "
labels: ["bug"]
body:
  - type: input
    id: app
    attributes:
      label: App name or package ID
      placeholder: Brave.Brave
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - winget
        - Microsoft Store
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Explain the incorrect field and what it should be.
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Correct homepage
      placeholder: https://example.com/
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link to the official page, winget manifest, or Store listing that supports the correction.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the package ID with winget or the Microsoft Store.
          required: true
        - label: This report does not contain passwords, keys, or other secrets.
          required: true
