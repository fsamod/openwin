name: Bug report
description: Report a problem with the OpenWin website or command generator.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, keys, or other secrets.
  - type: input
    id: page
    attributes:
      label: Page or feature
      placeholder: App picker, details dialog, privacy page, command preview
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: winget
    attributes:
      label: winget version
      placeholder: Output of winget --version
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 140, Firefox 142, Edge 140
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: This report does not contain passwords, keys, or other secrets.
          required: true
